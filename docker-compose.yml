name: ivms

# Supporting services for local development only (database, cache, media server, ...).
# The app itself runs natively via `uv run poe dev`, not in Docker.
# Service config files (init scripts, conf) go under docker/<service>/.
# Values come from .env (see .env.example); keep defaults so CI works without it.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ivms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ivms}
      POSTGRES_DB: ${POSTGRES_DB:-ivms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Cache only: no persistence, evict least-recently-used keys when full
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1-ffmpeg
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554" # RTSP (cameras in, AI service out)
      - "${MEDIAMTX_HLS_PORT:-8888}:8888" # HLS (browser fallback)
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889" # WebRTC / WHEP (browser Live View)
      - "8189:8189/udp" # WebRTC media; must match webrtcLocalUDPAddress
      - "${MEDIAMTX_API_PORT:-9997}:9997" # Control API (backend)
      - "${MEDIAMTX_METRICS_PORT:-9998}:9998" # Prometheus metrics
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
