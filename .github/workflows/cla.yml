name: CLA

# Asks every pull request author to accept CLA.md once. Signatures are stored in
# signatures/cla.json on the `cla-signatures` branch of this repository.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # write signatures/cla.json
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # Never checks out the pull request code, so pull_request_target is safe here
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: duongnh-aidev,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
